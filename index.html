<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#3A3F47" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kardo" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
  <title>Kardo</title>
</head>
<body>
  <div id="app">
    <header>
      <button id="back-btn" hidden aria-label="Back">&larr;</button>
      <h1 id="header-title">Kardo</h1>
      <span id="app-version">v50</span>
      <button id="backup-btn" aria-label="Backup and restore">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 15V3"/><path d="M8 7l4-4 4 4"/><path d="M4 13v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/>
        </svg>
      </button>
      <button id="add-btn" aria-label="Add card">+</button>
    </header>

    <main>
      <!-- Home view: list of saved cards -->
      <section id="view-home" class="view active">
        <ul id="card-list" class="card-list"></ul>
        <div id="empty-state" class="empty-state" hidden>
          <div class="big-icon">🪪</div>
          <p>No cards yet. Tap + to scan your first loyalty card.</p>
        </div>
      </section>

      <!-- Scan view: camera scanner -->
      <section id="view-scan" class="view">
        <button id="photo-btn" class="btn btn-secondary">Scan from photo</button>
        <input type="file" id="photo-input" accept="image/*" capture="environment" hidden />
        <button id="manual-btn" class="btn btn-secondary">Enter code manually</button>
        <div id="reader" style="margin-top: 12px;"></div>
        <div id="scan-result" class="scan-result" hidden>
          <div class="field" style="position: relative;">
            <label for="card-domain-input">Company</label>
            <input id="card-domain-input" type="text" placeholder="Search company…" autocapitalize="none" autocorrect="off" autocomplete="off" />
            <div id="domain-dropdown" class="dropdown" hidden></div>
          </div>
          <div class="field">
            <label for="card-name-input">Card name</label>
            <input id="card-name-input" type="text" placeholder="e.g. Tesco Clubcard" />
          </div>
          <div class="field">
            <label>Logo (optional)</label>
            <div id="add-logo-box" class="logo-box" role="button" tabindex="0" aria-label="Set card logo"></div>
          </div>
          <div class="field">
            <label for="card-code-input">Card code</label>
            <input id="card-code-input" type="text" placeholder="Card number / code" />
          </div>
          <div class="field" id="preview-field" hidden>
            <div class="barcode-wrap barcode-swipe" id="manual-preview"></div>
            <p class="format-label" id="format-label"></p>
          </div>
          <button id="save-card-btn" class="btn btn-primary">Save card</button>
          <button id="rescan-btn" class="btn btn-secondary">Scan again</button>
          <button type="button" id="add-cancel-btn" class="btn btn-secondary">Cancel</button>
        </div>
      </section>

      <!-- Detail view: shows a saved card's barcode large -->
      <section id="view-detail" class="view">
        <div class="detail-card">
          <h2 id="detail-name"></h2>
          <div class="barcode-wrap" id="detail-barcode"></div>
          <p class="code-value" id="detail-value"></p>
          <button id="edit-card-btn" class="btn btn-secondary">Edit card</button>
        </div>
      </section>

      <!-- Edit view: change a saved card's details -->
      <section id="view-edit" class="view">
        <div class="scan-result" style="display: block;">
          <div class="field" style="position: relative;">
            <label for="edit-domain-input">Company</label>
            <input id="edit-domain-input" type="text" placeholder="Search company…" autocapitalize="none" autocorrect="off" autocomplete="off" />
            <div id="edit-dropdown" class="dropdown" hidden></div>
          </div>
          <div class="field">
            <label for="edit-name-input">Card name</label>
            <input id="edit-name-input" type="text" placeholder="Card name" />
          </div>
          <div class="field">
            <label>Logo (optional)</label>
            <div id="edit-logo-box" class="logo-box" role="button" tabindex="0" aria-label="Set card logo"></div>
          </div>
          <div class="field">
            <label for="edit-code-input">Card code</label>
            <input id="edit-code-input" type="text" placeholder="Card number / code" />
          </div>
          <div class="field" id="edit-preview-field" hidden>
            <div class="barcode-wrap barcode-swipe" id="edit-preview"></div>
            <p class="format-label" id="edit-format-label"></p>
          </div>
          <button id="edit-save-btn" class="btn btn-primary">Save changes</button>
          <button type="button" id="edit-cancel-btn" class="btn btn-secondary">Cancel</button>
          <button id="delete-card-btn" class="btn btn-danger">Delete card</button>
          <button type="button" id="edit-diag-btn" class="btn btn-secondary" hidden>Diagnose logo (debug)</button>
          <textarea id="edit-diag-output" class="diag-output" readonly hidden></textarea>
        </div>
      </section>
    </main>

    <!-- Backup & restore sheet -->
    <div id="backup-modal" class="modal" hidden>
      <div class="modal-sheet">
        <h3 class="modal-title">Backup &amp; restore</h3>
        <button type="button" id="backup-export" class="btn btn-primary">Export cards</button>
        <button type="button" id="backup-import" class="btn btn-secondary">Import cards</button>
        <input type="file" id="backup-file" accept="application/json,.json" hidden />
        <button type="button" id="backup-cancel" class="btn">Cancel</button>
      </div>
    </div>

    <!-- Shared logo chooser sheet -->
    <div id="logo-modal" class="modal" hidden>
      <div class="modal-sheet">
        <h3 class="modal-title">Card logo</h3>
        <button type="button" id="lm-photo" class="btn btn-primary">Choose photo</button>
        <div class="field">
          <input id="lm-url" type="text" placeholder="…or paste a website / image URL" autocapitalize="none" autocorrect="off" />
        </div>
        <button type="button" id="lm-use-url" class="btn btn-secondary">Use this URL</button>
        <button type="button" id="lm-remove" class="btn btn-secondary">Remove logo</button>
        <button type="button" id="lm-cancel" class="btn">Cancel</button>
      </div>
    </div>
    <input type="file" id="lm-file" accept="image/*" hidden />
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="js/scanner.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
