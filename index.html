<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a73e8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CardHolder" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
  <title>CardHolder</title>
</head>
<body>
  <div id="app">
    <header>
      <button id="back-btn" hidden aria-label="Back">&larr;</button>
      <h1 id="header-title">CardHolder</h1>
      <button id="add-btn" aria-label="Add card">+</button>
    </header>

    <main>
      <!-- Home view: list of saved cards -->
      <section id="view-home" class="view active">
        <ul id="card-list" class="card-list"></ul>
        <div id="empty-state" class="empty-state" hidden>
          <div class="big-icon">🪪</div>
          <p>No cards yet. Tap + to scan your first loyalty card.</p>
        </div>
      </section>

      <!-- Scan view: camera scanner -->
      <section id="view-scan" class="view">
        <div id="reader"></div>
        <div id="scan-result" class="scan-result" hidden>
          <div class="field">
            <label for="card-name-input">Card name</label>
            <input id="card-name-input" type="text" placeholder="e.g. Tesco Clubcard" />
          </div>
          <div class="field">
            <label>Scanned code</label>
            <p class="code-value" id="scanned-value"></p>
          </div>
          <button id="save-card-btn" class="btn btn-primary">Save card</button>
          <button id="rescan-btn" class="btn btn-secondary">Scan again</button>
        </div>
      </section>

      <!-- Detail view: shows a saved card's barcode large -->
      <section id="view-detail" class="view">
        <div class="detail-card">
          <h2 id="detail-name"></h2>
          <div class="barcode-wrap" id="detail-barcode"></div>
          <p class="code-value" id="detail-value"></p>
          <button id="delete-card-btn" class="btn btn-danger">Delete card</button>
        </div>
      </section>
    </main>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="js/scanner.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
